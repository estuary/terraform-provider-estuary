          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_capture
          database: postgres
          historyMode: false
          credentials:
            auth_type: GCPIAM
            gcp_service_account_to_impersonate: estuary-capture@my-project.iam.gserviceaccount.com
            gcp_workload_identity_pool_audience: //iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/estuary/providers/estuary
    bindings:
      - resource: { namespace: public, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/postgres-azure-iam:
