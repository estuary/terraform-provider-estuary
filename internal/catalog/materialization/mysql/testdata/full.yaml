materializations:
  acmeCo/analytics/materialize-mysql:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-mysql:v2
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:3306
          user: flow_materialize
          password: <secret>
          database: analytics
          timezone: "+00:00"
          hardDelete: true
          dbt_job_trigger:
            job_id: "12345"
            account_id: "67890"
            api_key: <dbt-api-key>
            mode: ignore
          advanced:
            sslmode: verify_identity
            ssl_server_ca: |
              -----BEGIN CERTIFICATE-----
              <rds-ca>
              -----END CERTIFICATE-----
            ssl_client_cert: |
              -----BEGIN CERTIFICATE-----
              <client-cert>
              -----END CERTIFICATE-----
            ssl_client_key: |
              -----BEGIN PRIVATE KEY-----
              <client-key>
              -----END PRIVATE KEY-----
            no_flow_document: true
            feature_flags: allow_existing_tables_for_new_bindings
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-123-4-567-89.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource:
          table: orders
        source: acmeCo/orders
        fields:
          recommended: true

      - resource:
          table: customers
          additional_table_create_sql: CREATE INDEX customers_email ON customers (email);
        source: acmeCo/customers

      - resource:
          table: events
          delta_updates: true
        source: acmeCo/events
