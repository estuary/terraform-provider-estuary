materializations:
  acmeCo/iceberg/rest-access-key:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          credentials:
            auth_type: AWSAccessKey
            awsAccessKeyId: AKIAXXXXXXXXXXXXXXXX
            awsSecretAccessKey: <secret-access-key>
          bucket: my-iceberg-bucket
          prefix: warehouse
          region: us-east-1
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: Iceberg REST Server
            uri: https://catalog.example.com/api/catalog
            warehouse: my_warehouse
            credential: <client_id>:<client_secret>
            scope: PRINCIPAL_ROLE:ALL
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders

  acmeCo/iceberg/rest-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          credentials:
            auth_type: AWSIAM
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-iceberg
            aws_region: us-east-1
          bucket: my-iceberg-bucket
          prefix: warehouse
          region: us-east-1
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: Iceberg REST Server
            uri: https://lakekeeper.example.com/catalog
            warehouse: my_warehouse
            token: <bearer-token>
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders

  acmeCo/iceberg/glue-access-key:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          credentials:
            auth_type: AWSAccessKey
            awsAccessKeyId: AKIAXXXXXXXXXXXXXXXX
            awsSecretAccessKey: <secret-access-key>
          bucket: my-iceberg-bucket
          prefix: warehouse
          region: us-east-2
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: AWS Glue
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders

  acmeCo/iceberg/glue-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          credentials:
            auth_type: AWSIAM
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-iceberg
            aws_region: us-east-2
          bucket: my-iceberg-bucket
          prefix: warehouse
          region: us-east-2
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: AWS Glue
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders

  acmeCo/iceberg/glue-iam-cross-account:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          credentials:
            auth_type: AWSIAM
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-iceberg
            aws_region: us-east-2
          bucket: shared-iceberg-bucket
          prefix: warehouse
          region: us-east-2
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: AWS Glue
            glue_id: "210987654321"
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders

  acmeCo/iceberg/legacy-keys:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-s3-iceberg:v2
        config:
          aws_access_key_id: AKIAXXXXXXXXXXXXXXXX
          aws_secret_access_key: <secret-access-key>
          bucket: my-iceberg-bucket
          prefix: warehouse
          region: us-east-1
          namespace: analytics
          upload_interval: PT5M
          catalog:
            catalog_type: AWS Glue
    bindings:
      - resource:
          table: orders
          delta_updates: true
        source: acmeCo/orders
