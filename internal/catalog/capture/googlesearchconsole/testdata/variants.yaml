captures:
  acmeCo/search-console/service-account:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-google-search-console:v2
        config:
          site_urls:
            - https://www.acme.example/
          start_date: "2024-01-01"
          credentials:
            auth_type: Service
            service_account_info: |
              { "type": "service_account", "project_id": "acme-search", "private_key": "<private-key>" }
            email: admin@acme.example
    bindings:
      - resource: { stream: search_analytics_by_date, syncMode: incremental, cursorField: [date] }
        target: acmeCo/search-console/search_analytics_by_date

      - resource: { stream: sites, syncMode: full_refresh }
        target: acmeCo/search-console/sites

  acmeCo/search-console/oauth:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-google-search-console:v2
        config:
          site_urls:
            - sc-domain:acme.example
          start_date: "2024-01-01"
          credentials:
            auth_type: Client
            client_id: <client-id>
            client_secret: <client-secret>
            refresh_token: <refresh-token>
    bindings:
      - resource: { stream: search_analytics_by_date, syncMode: incremental, cursorField: [date] }
        target: acmeCo/search-console/search_analytics_by_date

  acmeCo/search-console/dashboard-login:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-google-search-console:v2
        config:
          site_urls:
            - sc-domain:acme.example
          start_date: "2024-01-01"
          custom_reports: '[{"name": "by_country_and_device", "dimensions": ["date", "country", "device"]}]'
          credentials:
            auth_type: Client
    bindings:
      - resource: { stream: by_country_and_device, syncMode: incremental, cursorField: [date] }
        target: acmeCo/search-console/by_country_and_device
