captures:
  acmeCo/google-play/service-account:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-google-play:v1
        config:
          bucket: pubsite_prod_1234567890123456789
          credentials:
            credentials_title: Google Service Account
            service_account: |
              { "type": "service_account", "project_id": "acme-play", "private_key": "<private-key>" }
    bindings:
      - resource: { name: installs, interval: PT1H }
        target: acmeCo/google-play/installs

  acmeCo/google-play/imported:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-google-play:v1
        config:
          bucket: pubsite_prod_1234567890123456789
          credentials:
            credentials_title: Google Service Account
    bindings:
      - resource: { name: reviews }
        target: acmeCo/google-play/reviews
