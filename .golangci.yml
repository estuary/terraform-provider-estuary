version: "2"

# Run with the version pinned in tools/golangci-lint.mod:
#
#   go tool -modfile=tools/golangci-lint.mod golangci-lint run
#
# The tool has its own modfile so its dependencies stay out of go.mod and the
# provider's build. To upgrade, run:
#
#   go get -modfile=tools/golangci-lint.mod -tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint@<version>
linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # Deferred cleanup of a workspace the provider made itself. A failure
      # leaves a temporary directory behind and changes no result.
      exclude-functions:
        - (*os.Root).Close
        - os.RemoveAll

    staticcheck:
      # golangci-lint's defaults, then the two checks that flag an explicit
      # type in a declaration, such as `var name string = ...`. The repo
      # declares types on purpose, so a reader sees each one without looking
      # up the right-hand side.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023 # Redundant type in variable declaration.
        - -QF1011 # Omit redundant type from variable declaration.
        # De Morgan's law. `!(a && b)` often says "not both" more plainly
        # than its expansion.
        - -QF1001
