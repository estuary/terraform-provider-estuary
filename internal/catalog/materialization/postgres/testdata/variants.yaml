materializations:
  acmeCo/postgres/password:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: UserPassword
            password: <secret>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/gcp-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: GCPIAM
            gcp_service_account_to_impersonate: estuary-materialize@my-project.iam.gserviceaccount.com
            gcp_workload_identity_pool_audience: //iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/estuary/providers/estuary
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/azure-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: AzureIAM
            azure_client_id: 00000000-0000-0000-0000-000000000001
            azure_tenant_id: 00000000-0000-0000-0000-000000000002
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/ssh-tunnel:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89:5432
          user: flow_materialize
          credentials:
            auth_type: UserPassword
            password: <secret>
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-123-4-567-89.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/legacy-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89
          user: flow_materialize
          password: <secret>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/rds/postgres-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-amazon-rds-postgres:v5
        config:
          address: my-instance.123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: UserPassword
            password: <secret>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/rds/postgres-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-amazon-rds-postgres:v5
        config:
          address: my-instance.123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-materialize
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/aurora/postgres-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-amazon-aurora-postgres:v5
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-materialize
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders
