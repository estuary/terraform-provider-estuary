captures:
  acmeCo/aurora/postgres-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-postgres:v3
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_capture
          database: postgres
          historyMode: false
          credentials:
            auth_type: UserPassword
            password: <secret>
    bindings:
      - resource: { namespace: public, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/postgres-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-postgres:v3
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_capture
          database: postgres
          historyMode: false
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-aurora-capture
    bindings:
      - resource: { namespace: public, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/postgres-ssh-tunnel:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-postgres:v3
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_capture
          database: postgres
          historyMode: false
          credentials:
            auth_type: UserPassword
            password: <secret>
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-123-4-567-89.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource: { namespace: public, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/postgres-legacy-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-postgres:v3
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_capture
          password: <secret>
          database: postgres
          historyMode: false
    bindings:
      - resource: { namespace: public, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/postgres-gcp-iam:
