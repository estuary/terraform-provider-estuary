materializations:
  acmeCo/dekaf/generic:
    endpoint:
      dekaf:
        variant: generic
        config:
          token: <auth-token>
          strict_topic_names: false
          deletions: kafka
    bindings:
      - resource: { topic_name: orders }
        source: acmeCo/orders

  acmeCo/dekaf/generic-strict:
    endpoint:
      dekaf:
        variant: generic
        config:
          token: <auth-token>
          strict_topic_names: true
