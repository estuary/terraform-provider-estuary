materializations:
  acmeCo/analytics/materialize-dynamodb:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-dynamodb:v1
        config:
          region: eu-west-1
          credentials:
            auth_type: AWSIAM
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-dynamodb
            aws_region: eu-west-1
          advanced:
            endpoint: http://localhost:8000
            feature_flags: retain_existing_data_on_backfill
    bindings:
      - resource:
          table: orders
        source: acmeCo/orders
        fields:
          recommended: true

      - resource:
          table: customers.v2
        source: acmeCo/customers
