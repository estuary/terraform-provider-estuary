captures:
  acmeCo/zendesk/api-token:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-zendesk-support-native:v1
        config:
          subdomain: acme
          credentials:
            credentials_title: Email & API Token
            username: support-bot@acme.example
            password: <api-token>
    bindings:
      - resource: { name: tickets, interval: PT5M }
        target: acmeCo/zendesk/tickets

  acmeCo/zendesk/oauth:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-zendesk-support-native:v1
        config:
          subdomain: acme
          credentials:
            credentials_title: OAuth Credentials
            client_id: <client-id>
            client_secret: <client-secret>
            refresh_token: <refresh-token>
            access_token: <access-token>
            access_token_expires_at: "2026-01-01T00:30:00Z"
    bindings:
      - resource: { name: tickets, interval: PT5M }
        target: acmeCo/zendesk/tickets

  acmeCo/zendesk/dashboard-login:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-zendesk-support-native:v1
        config:
          subdomain: acme
          credentials:
            credentials_title: OAuth Credentials
    bindings:
      - resource: { name: users }
        target: acmeCo/zendesk/users
