captures:
  acmeCo/aurora/mysql-all-options:
    autoDiscover:
      addNewBindings: true
      evolveIncompatibleCollections: true
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-mysql:v3
        config:
          address: my-cluster.cluster-abc123xyz.us-east-1.rds.amazonaws.com:3306
          user: flow_capture
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-aurora-capture
          timezone: "+00:00"
          historyMode: true
          discoveryFilters:
            include_schemas:
              - shop
              - billing
            exclude_schemas:
              - audit
            table_patterns:
              - shop.orders*
              - customers
          advanced:
            dbname: shop
            skip_binlog_retention_check: true
            node_id: 1234
            skip_backfills: shop.events,shop.logs
            backfill_chunk_size: 10000
            discover_schemas:
              - shop
            source_tag: aurora-writer
            rediscovery_interval: 1h
            feature_flags: tinyint1_as_bool
            statement_timeout: 5m
            sslmode: verify_ca
            ssl_server_ca: |
              -----BEGIN CERTIFICATE-----
              <server-ca>
              -----END CERTIFICATE-----
            ssl_client_cert: |
              -----BEGIN CERTIFICATE-----
              <client-certificate>
              -----END CERTIFICATE-----
            ssl_client_key: |
              -----BEGIN PRIVATE KEY-----
              <client-key>
              -----END PRIVATE KEY-----
            watermarks_table: flow.watermarks
            heartbeat_interval: 60s
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-198-21-98-1.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource:
          namespace: shop
          stream: orders
        target: acmeCo/aurora/orders

      - resource:
          namespace: billing
          stream: customers
          mode: Precise
          priority: 10
        target: acmeCo/aurora/customers
        backfill: 2

      - resource:
          namespace: shop
          stream: events
          mode: Only Changes
          priority: -1
          advanced:
            additional_backfill_filter: created_at > '2026-01-01'
        target: acmeCo/aurora/events

      - resource:
          namespace: shop
          stream: logs
          mode: Without Primary Key
          primary_key:
            - id
        target: acmeCo/aurora/logs
        disable: true

      - resource:
          namespace: shop
          stream: invoices
          mode: Normal
        target: acmeCo/aurora/invoices
