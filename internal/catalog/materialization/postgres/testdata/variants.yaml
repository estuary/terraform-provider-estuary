materializations:
  acmeCo/postgres/password:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: UserPassword
            password: <secret>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/aurora-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com:5432
          user: flow_materialize
          database: analytics
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-materialize
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/ssh-tunnel:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: 123.4.567.89:5432
          user: flow_materialize
          credentials:
            auth_type: UserPassword
            password: <secret>
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-123-4-567-89.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/postgres/legacy-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-postgres:v5
        config:
          address: my-cluster.cluster-123456789.us-east-1.rds.amazonaws.com
          user: flow_materialize
          password: <secret>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders
