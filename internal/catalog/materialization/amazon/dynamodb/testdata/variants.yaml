materializations:
  acmeCo/dynamodb/access-key:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-dynamodb:v1
        config:
          credentials:
            auth_type: AWSAccessKey
            aws_access_key_id: example-aws-access-key-id
            aws_secret_access_key: example-aws-secret-access-key
          region: us-east-1
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders

  acmeCo/dynamodb/iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-dynamodb:v1
        config:
          credentials:
            auth_type: AWSIAM
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-dynamodb
            aws_region: us-east-1
          region: us-east-1
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders
