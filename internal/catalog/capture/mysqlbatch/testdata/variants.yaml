captures:
  acmeCo/mysql-batch/tables:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-mysql-batch:v1
        config:
          address: mysql.example.com:3306
          user: flow_capture
          password: <secret>
    bindings:
      - resource: { name: orders, schema: shop, table: orders, cursor: [updated_at] }
        target: acmeCo/mysql-batch/orders

      - resource: { name: countries, schema: shop, table: countries }
        target: acmeCo/mysql-batch/countries

  acmeCo/mysql-batch/ssh-tunnel:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-mysql-batch:v1
        config:
          address: mysql.example.com:3306
          user: flow_capture
          password: <secret>
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-198-51-100-7.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
              knownHosts: "ec2-198-51-100-7.compute-1.amazonaws.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample"
    bindings:
      - resource: { name: orders, schema: shop, table: orders, cursor: [updated_at], poll: 15m }
        target: acmeCo/mysql-batch/orders

  acmeCo/mysql-batch/imported:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-mysql-batch:v1
        config:
          address: mysql.example.com:3306
          user: flow_capture
    bindings:
      - resource: { name: orders, schema: shop, table: orders }
        target: acmeCo/mysql-batch/orders
