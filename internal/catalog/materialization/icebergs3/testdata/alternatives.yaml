materializations:
  acmeCo/iceberg/all-options:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-iceberg:v1
        config:
          url: https://catalog.example.com/api/catalog
          warehouse: my_warehouse
          namespace: analytics
          credentials:
            auth_type: OAuth 2.0 Client Credentials
            oauth2_server_uri: v1/oauth/tokens
            credential: <client_id>:<client_secret>
            scope: PRINCIPAL_ROLE:my_role
          compute:
            compute_type: AWS EMR Serverless
            region: us-east-1
            application_id: 00abcdefghijklmn
            execution_role_arn: arn:aws:iam::123456789012:role/estuary-emr-execution
            bucket: my-staging-bucket
            systems_manager_prefix: /estuary/
            credentials:
              auth_type: AWSAccessKey
              aws_access_key_id: AKIAXXXXXXXXXXXXXXXX
              aws_secret_access_key: <secret-access-key>
            spark_job_properties:
              - key: spark.executor.memory
                value: 8g
          syncSchedule:
            syncFrequency: 30m
            timezone: UTC
            fastSyncStartTime: "09:00"
            fastSyncStopTime: "17:00"
            fastSyncEnabledDays: M-F
          dbt_job_trigger:
            job_id: "<job-id>"
            account_id: "<account-id>"
            api_key: <dbt-api-key>
            access_url: https://cloud.getdbt.com
            cause: Estuary
            mode: replace
            interval: 1h
          advanced:
            table_identifier_case: uppercase
            feature_flags: nested_dot_hash_location_style
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders
        fields:
          recommended: true
          exclude:
            - someLargeField

  acmeCo/iceberg/legacy-oauth:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-iceberg:v1
        config:
          url: https://catalog.example.com/api/catalog
          warehouse: my_warehouse
          namespace: analytics
          catalog_authentication:
            catalog_auth_type: OAuth 2.0 Client Credentials
            oauth2_server_uri: v1/oauth/tokens
            credential: <client_id>:<client_secret>
            scope: PRINCIPAL_ROLE:my_role
          compute:
            compute_type: AWS EMR Serverless
            region: us-east-1
            application_id: 00abcdefghijklmn
            execution_role_arn: arn:aws:iam::123456789012:role/estuary-emr-execution
            bucket: my-staging-bucket
            systems_manager_prefix: /estuary/
            aws_access_key_id: AKIAXXXXXXXXXXXXXXXX
            aws_secret_access_key: <secret-access-key>
    bindings:
      - resource: { table: orders }
        source: acmeCo/orders
