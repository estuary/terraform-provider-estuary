captures:
  acmeCo/aurora/mysql-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-mysql:v3
        config:
          address: my-cluster.cluster-abc123xyz.us-east-1.rds.amazonaws.com:3306
          user: flow_capture
          credentials:
            auth_type: UserPassword
            password: <secret>
    bindings:
      - resource: { namespace: shop, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/mysql-iam:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-mysql:v3
        config:
          address: my-cluster.cluster-abc123xyz.us-east-1.rds.amazonaws.com:3306
          user: flow_capture
          credentials:
            auth_type: AWSIAM
            aws_region: us-east-1
            aws_role_arn: arn:aws:iam::123456789012:role/estuary-aurora-capture
    bindings:
      - resource: { namespace: shop, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/mysql-ssh-tunnel:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-mysql:v3
        config:
          address: my-cluster.cluster-abc123xyz.us-east-1.rds.amazonaws.com:3306
          user: flow_capture
          credentials:
            auth_type: UserPassword
            password: <secret>
          networkTunnel:
            sshForwarding:
              sshEndpoint: ssh://ec2-user@ec2-198-21-98-1.compute-1.amazonaws.com:22
              privateKey: |
                -----BEGIN RSA PRIVATE KEY-----
                <private-key>
                -----END RSA PRIVATE KEY-----
    bindings:
      - resource: { namespace: shop, stream: orders }
        target: acmeCo/aurora/orders

  acmeCo/aurora/mysql-legacy-password:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-amazon-aurora-mysql:v3
        config:
          address: my-cluster.cluster-abc123xyz.us-east-1.rds.amazonaws.com:3306
          user: flow_capture
          password: <secret>
          timezone: America/New_York
    bindings:
      - resource: { namespace: shop, stream: orders }
        target: acmeCo/aurora/orders
